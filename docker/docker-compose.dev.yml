version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kloudops-net

  backend:
    build:
      context: ../backend-api
    container_name: kloudops-backend-dev
    environment:
      ENV: dev
      AGENT_API_TOKEN: ${AGENT_API_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    volumes:
      - ../backend-api:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_started
    networks:
      - kloudops-net

  agent:
    build:
      context: ../agent
      target: debug
    container_name: kloudops-agent-dev
    environment:
      AGENT_ID: ${AGENT_ID}
      API_URL: http://backend:8000
      AGENT_API_TOKEN: ${AGENT_API_TOKEN}
      PORT: 8080
      ENV: dev
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - kloudops-net

volumes:
  postgres_data:

networks:
  kloudops-net:
    driver: bridge
