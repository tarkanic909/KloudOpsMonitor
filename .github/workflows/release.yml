name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # only semver tags

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io/tarkanic909
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ===== PROD BUILD =====
      - name: Build & push agent (prod)
        run: |
          docker build \
            --target prod \
            -t $REGISTRY/kloudops-agent:${VERSION} \
            -t $REGISTRY/kloudops-agent:latest \
            ./agent

          docker push $REGISTRY/kloudops-agent:${VERSION}
          docker push $REGISTRY/kloudops-agent:latest

      - name: Build & push backend
        run: |
          docker build \
            -t $REGISTRY/kloudops-backend:${VERSION} \
            -t $REGISTRY/kloudops-backend:latest \
            ./backend-api

          docker push $REGISTRY/kloudops-backend:${VERSION}
          docker push $REGISTRY/kloudops-backend:latest
          
      - name: Deploy to staging
        run: |
          docker compose -f docker-compose.staging.yml pull
          docker compose -f docker-compose.staging.yml up -d
