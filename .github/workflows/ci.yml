name: CI

on:
  workflow_dispatch:
  push:
    branches: ["master", "develop", "feature/*"]
  pull_request: 
    branches: ["master", "develop"]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go vet
        run: |
          cd agent
          go vet ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd backend-api
          pip install -r requirements.txt

      - name: Backend import check
        run: |
          cd backend-api
          python -c "import app.main"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'

    env:
      REGISTRY: ghcr.io/tarkanic909

    steps:
      - name: Compute image tag
        id: meta
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME}"
          SAFE="$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')"
          echo "tag=$SAFE" >> "$GITHUB_OUTPUT"

      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Go agent Docker image
        run: |
          TAG=${{ steps.meta.outputs.tag }}
          docker build --target debug -t $REGISTRY/kloudops-agent:$TAG ./agent

      - name: Build Python backend Docker image
        run: |
          TAG=${{ steps.meta.outputs.tag }}
          docker build -t $REGISTRY/kloudops-backend:$TAG ./backend-api

      - name: Push Docker images
        run: |
          TAG=${{ steps.meta.outputs.tag }}
          docker push $REGISTRY/kloudops-agent:$TAG
          docker push $REGISTRY/kloudops-backend:$TAG

      - name: List Docker images
        run: docker images
      